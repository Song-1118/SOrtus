name: 我要提交 Bug
description: 功能没按预期工作、崩溃、界面异常等
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先确认：

        - 已搜索过现有 Issues，没有重复
        - 已升级到 [最新 Release](https://github.com/OWNER/REPO/releases/latest) 仍可复现

  - type: textarea
    id: summary
    attributes:
      label: 问题简述
      description: 用一两句话说明出了什么问题
      placeholder: 打开设置窗口后点击"保存"，应用直接闪退
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请按 1、2、3 的顺序写清楚操作路径，越具体越好
      value: |
        1. 打开应用，进入「...」
        2. 点击「...」
        3. 执行「...」
        4. 出现问题
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 设置应当被保存，窗口正常关闭
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？如果有报错弹窗、崩溃窗口，请把文字原样贴过来
      placeholder: 应用无响应 2 秒后退出，再次打开时设置已丢失
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 应用版本
      description: 在「关于」页面可查询
      placeholder: v1.2.3
    validations:
      required: true

  - type: dropdown
    id: win_version
    attributes:
      label: Windows 版本
      description: 按 Win + R 输入 winver 可查看完整版本号
      options:
        - Windows 11 (23H2 及以后)
        - Windows 11 (22H2 及更早)
        - Windows 10 (22H2)
        - Windows 10 (21H2 及更早)
        - Windows 10 LTSC / LTSB
        - 其他（请在下方补充说明）
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: 系统架构
      options:
        - x64（64 位，最常见）
        - ARM64（骁龙 / Windows on ARM）
        - x86（32 位）
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: 安装方式
      options:
        - Release 页面下载的安装程序（.exe / .msi）
        - 自己从源码编译
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: |
        崩溃或异常时请附上日志，这几乎是定位问题的关键。日志文件通常位于：
        %LOCALAPPDATA%\<应用名>\logs\ 或应用目录下的 logs 文件夹。
        可直接把文本粘贴进来，或把截图 / 录屏拖拽到输入框。
      placeholder: 粘贴日志内容，或将截图拖到这里
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: 临时解决办法（可选）
      description: 你是否找到了绕开这个问题的办法？重装、删配置文件后有变化吗？
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues，确认没有重复
          required: true
        - label: 我使用的是最新 Release 版本
          required: true
        - label: 我愿意配合提供更多信息或测试修复版本
          required: false
